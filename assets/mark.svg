<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="72" height="72" fill="none" stroke="#B08A34" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- a child's kite, tugging upward: wonder you can hold by a string -->
  <path d="M36 8 L52 28 L36 50 L20 28 Z" fill="#EEF6FB"/>
  <path d="M36 8 V50 M20 28 H52"/>
  <!-- a small pastel patch and a star of light on the kite -->
  <path d="M36 8 L52 28 L36 28 Z" fill="#EAF4EC" stroke="none"/>
  <path d="M42 19 l1.2 2.6 2.8.4-2 2 .5 2.8-2.5-1.3-2.5 1.3.5-2.8-2-2 2.8-.4z" fill="#FFFFFF"/>
  <!-- the tail, with three little bows -->
  <path d="M36 50 c-3 5 3 8 0 13 c-2 3 1 5 -1 7"/>
  <path d="M34 56 l-3-1.6 3-1.6z M38.5 62 l3-1.6-3-1.6z M33 68 l-3-1.4 3-1.6z" fill="#EAF4EC"/>
  <!-- a wisp of cloud, passing -->
  <path d="M8 22 h9 a3.5 3.5 0 0 0 .4-7 a5 5 0 0 0 -9.4 -1.2 A3.8 3.8 0 0 0 8 22z" fill="#FFFFFF" stroke="#DDCFA6"/>
  <!-- three sparks of wonder -->
  <path d="M58 12 v4 M56 14 h4 M62 40 v3 M60.5 41.5 h3 M14 44 v3 M12.5 45.5 h3" stroke="#DDCFA6"/>
</svg>
